aid: condor
name: Condor
description: >-
  Condor is the Financial Intelligence Layer purpose-built for Life Sciences R&D.
  Its AI-powered platform automatically unifies clinical, operational, and
  financial data from disparate systems and vendors (CTMS, EDC, ERP, and CRO
  data), replacing manual spreadsheet reconciliation with automated clinical
  trial accruals, real-time forecasting, and board-ready insights. Condor serves
  emerging and enterprise biopharma, MedTech companies, and CROs through its
  Connect, Copilot, and Compass products spanning accounting, FP&A, and
  analytics, built on a clinical trial finance ontology co-developed with EY,
  KPMG, and PwC. The company is SOC 1 Type 2 and SOC 2 Type 2 compliant, manages
  over $19B in R&D spend, was founded by Jen Kyle, is headquartered in San Diego,
  and is backed by Insight Partners, Felicis, and 645 Ventures.
